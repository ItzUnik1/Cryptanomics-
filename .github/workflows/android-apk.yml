name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: cryptanomics-android-release
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create dependency lockfile when needed
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm install

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build web application
        run: npm run build

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate CRYPTANOMICS Android launcher icons
        run: npm run android:icons

      - name: Keep native Android build files in the repository
        run: |
          git add android package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(android): add native project and lockfile [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure persistent release signing
        env:
          ANDROID_SIGNING_CONFIG: ${{ secrets.ANDROID_SIGNING_CONFIG }}
        run: node scripts/configure-android-signing.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRYPTANOMICS-v${{ steps.version.outputs.version }}-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CRYPTANOMICS v${{ steps.version.outputs.version }}
          body: |
            ## CRYPTANOMICS v${{ steps.version.outputs.version }}

            Signed Android release APK for this release.

            Download the APK below and confirm installation through Android.
          files: android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
